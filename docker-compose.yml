# Local Postgres for ApplyFlow (free). Alternatively use a locally installed Postgres 16+.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: applyflow
      POSTGRES_DB: applyflow
    ports:
      - "5432:5432"
    volumes:
      - applyflow-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
volumes:
  applyflow-db:
