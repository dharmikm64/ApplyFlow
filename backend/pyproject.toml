[project]
name = "applyflow"
version = "0.1.0"
description = "Turn recruiting emails into an application tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "tenacity>=9",
  "beautifulsoup4>=4.12",
  "pydantic-settings>=2.4",
  "python-dateutil>=2.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query() defaults are the idiom. E501: long regex/rule tables.
ignore = ["B008", "E501", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
